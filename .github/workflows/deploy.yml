name: Live Deployment

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only list what would be transferred or deleted
        type: boolean
        default: false

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: cscp-hosteurope
    env: 
      VITE_PUBLIC_MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
    steps:
      - name: Checkout repository using git
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - name: Install Node dependencies
        run: npm ci
      - name: Build site Frontend
        run: npm run build
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Install PHP dependencies
        run: composer install --ignore-platform-reqs --optimize-autoloader --no-dev --no-interaction --no-progress
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: deployment
          include-hidden-files: true
          retention-days: 5
          path: |
            assets/
            build/
            site/
            !site/accounts/**
            !site/cache/**
            !site/sessions/**
            vendor/
            kirby/
            content/
            index.php
            .htaccess
            .rsync-filter

  deploy:
    needs: build
    environment: cscp-hosteurope
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      SSH_FOLDER: ${{ secrets.SSH_FOLDER }}
      HTACCESS: ${{ vars.HTACCESS }}

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: deployment
          path: dist
      - run: echo "$HTACCESS" > dist/.htaccess
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      # --checksum compares file contents instead of timestamps (which are new on
      # every CI run), so only files that actually changed are transferred.
      # --delete-after removes stale files, limited by the rules in .rsync-filter.
      - name: Sync files to server
        run: |
          rsync --recursive --links --compress --checksum --delete-after --itemize-changes \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            --filter='merge dist/.rsync-filter' \
            -e "ssh -i ~/.ssh/deploy_key" \
            dist/ "$SSH_USER@$SSH_HOST:$SSH_FOLDER/"
